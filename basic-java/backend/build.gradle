plugins {
    id 'application'     // контракт: собирается при деплое
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

// API лежит рядом с контрактом, но со своими зависимостями: их версии конфликтуют
sourceSets {
    api
}

dependencies {
    implementation 'org.hyperledger.fabric-chaincode-java:fabric-chaincode-shim:2.5.+'
    implementation 'com.owlike:genson:1.6'

    apiImplementation 'org.springframework.boot:spring-boot-starter-web:3.5.16'
    apiImplementation 'org.hyperledger.fabric:fabric-gateway:1.13.0'
    apiImplementation platform('com.google.protobuf:protobuf-bom:4.36.2')
    apiImplementation platform('io.grpc:grpc-bom:1.84.0')
    apiImplementation 'io.grpc:grpc-api'
    apiRuntimeOnly 'io.grpc:grpc-netty-shaded'
}

tasks.withType(JavaCompile) {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'      // Spring берёт имена параметров из кода
}

application {
    mainClass = 'org.hyperledger.fabric.contract.ContractRouter'
}

// Запуск API: ./gradlew api
tasks.register('api', JavaExec) {
    classpath = sourceSets.api.runtimeClasspath
    mainClass = 'users.Application'
}
