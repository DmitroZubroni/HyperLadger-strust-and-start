# Сеть: 1 ордерер, по одному пиру и по одному CA на организацию, CLI-контейнер.
name: fabric-traffic

networks:
  fabric:
    name: fabric_traffic

x-peer-env: &peer-env
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
  CORE_PEER_GOSSIP_USELEADERELECTION: "true"
  CORE_PEER_GOSSIP_ORGLEADER: "false"
  # Пир сам собирает и запускает контейнер chaincode через Docker
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fabric_traffic

services:
  orderer.orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.orderer.example.com
    networks: [fabric]
    ports: ["7050:7050", "7053:7053"]
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      # Без системного канала: каналы создаются через osnadmin
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    volumes:
      - ./crypto/ordererOrganizations/orderer.example.com/orderers/orderer.orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./crypto/ordererOrganizations/orderer.example.com/orderers/orderer.orderer.example.com/tls:/var/hyperledger/orderer/tls

  peer0.bank.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.bank.example.com
    networks: [fabric]
    ports: ["7051:7051"]
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.bank.example.com
      CORE_PEER_ADDRESS: peer0.bank.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.bank.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bank.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bank.example.com:7051
      CORE_PEER_LOCALMSPID: BankMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/bank.example.com/peers/peer0.bank.example.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/bank.example.com/peers/peer0.bank.example.com/tls:/etc/hyperledger/fabric/tls

  peer0.users.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.users.example.com
    networks: [fabric]
    ports: ["9051:9051"]
    environment:
      <<: *peer-env
      CORE_PEER_ID: peer0.users.example.com
      CORE_PEER_ADDRESS: peer0.users.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.users.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.users.example.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.users.example.com:9051
      CORE_PEER_LOCALMSPID: UsersMSP
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto/peerOrganizations/users.example.com/peers/peer0.users.example.com/msp:/etc/hyperledger/fabric/msp
      - ./crypto/peerOrganizations/users.example.com/peers/peer0.users.example.com/tls:/etc/hyperledger/fabric/tls

  # CA каждой организации подписывает сертификаты тем же ключом, что выдал cryptogen,
  # поэтому выданные им пользователи автоматически входят в MSP организации.
  ca.bank.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.bank.example.com
    networks: [fabric]
    ports: ["7054:7054"]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-bank
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: localhost,ca.bank.example.com
      FABRIC_CA_SERVER_CA_CERTFILE: /ca/ca.bank.example.com-cert.pem
      FABRIC_CA_SERVER_CA_KEYFILE: /ca/priv_sk
    command: fabric-ca-server start -b admin:adminpw
    volumes:
      - ./crypto/peerOrganizations/bank.example.com/ca:/ca:ro

  ca.users.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.users.example.com
    networks: [fabric]
    ports: ["8054:8054"]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-users
      FABRIC_CA_SERVER_PORT: "8054"
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: localhost,ca.users.example.com
      FABRIC_CA_SERVER_CA_CERTFILE: /ca/ca.users.example.com-cert.pem
      FABRIC_CA_SERVER_CA_KEYFILE: /ca/priv_sk
    command: fabric-ca-server start -b admin:adminpw
    volumes:
      - ./crypto/peerOrganizations/users.example.com/ca:/ca:ro

  # Все утилиты Fabric (peer, osnadmin и т. д.) запускаются отсюда — на хост их ставить не нужно.
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: cli
    networks: [fabric]
    tty: true
    stdin_open: true
    working_dir: /work
    environment:
      FABRIC_LOGGING_SPEC: WARN
      CORE_PEER_TLS_ENABLED: "true"
    command: /bin/bash
    volumes:
      - ./crypto:/work/crypto
      - ./channel-artifacts:/work/channel-artifacts
      - ../chaincode:/work/chaincode:ro
