# Описание участников сети для cryptogen.
# EnableNodeOUs: true включает роли admin/peer/client/orderer по полю OU сертификата.
OrdererOrgs:
  - Name: Orderer
    Domain: orderer.example.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        SANS: [localhost]

PeerOrgs:
  - Name: Bank
    Domain: bank.example.com
    EnableNodeOUs: true
    Template:
      Count: 1            # peer0.bank.example.com
      SANS: [localhost]
    Users:
      Count: 0            # пользователи выдаются через Fabric CA

  - Name: Users
    Domain: users.example.com
    EnableNodeOUs: true
    Template:
      Count: 1            # peer0.users.example.com
      SANS: [localhost]
    Users:
      Count: 0
